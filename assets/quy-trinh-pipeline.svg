<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .card { rx: 14px; ry: 14px; stroke-width: 1.5; filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.08)); }
      .badge { rx: 6px; ry: 6px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748b; line-height: 1.4; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 600; }
      .arrow { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
      .arrow-head { fill: #94a3b8; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <g transform="translate(30, 24)">
    <rect width="40" height="40" rx="10" fill="#fef3c7" stroke="#fde68a"/>
    <text x="20" y="26" text-anchor="middle" font-size="20">✏️</text>
    <text x="52" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="800" fill="#0f172a">Quy Trình Tạo Video Hoạt Hình Vẽ Tay (Whiteboard Pipeline)</text>
    <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Pipeline 6 giai đoạn khép kín từ phụ đề SRT đến video MP4 nét vẽ tay mượt mà</text>
  </g>

  <!-- ================= ROW 1 (Steps 1, 2, 3) ================= -->
  <!-- Step 1 -->
  <g transform="translate(30, 85)">
    <rect class="card" width="270" height="175" fill="#ffffff" stroke="#3b82f6"/>
    <rect width="270" height="4" rx="2" fill="#3b82f6"/>
    <rect class="badge" x="16" y="16" width="72" height="22" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="badge-text" x="52" y="31" text-anchor="middle" fill="#2563eb">BƯỚC 01</text>
    <text x="242" y="33" text-anchor="middle" font-size="18">📄</text>
    
    <text class="title" x="16" y="62">Chuẩn bị SRT &amp; Phân cảnh</text>
    <text class="desc" x="16" y="84">
      <tspan x="16" dy="0">Chia SRT thành các phân cảnh</tspan>
      <tspan x="16" dy="16">khoảng 25–35s. Mỗi phân cảnh chỉ</tspan>
      <tspan x="16" dy="16">truyền tải một ý niệm cốt lõi.</tspan>
    </text>
    
    <line x1="16" y1="135" x2="254" y2="135" stroke="#f1f5f9" stroke-width="1"/>
    <text class="desc" x="16" y="154" fill="#94a3b8">Công cụ:</text>
    <rect x="175" y="141" width="80" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="code-text" x="215" y="154" text-anchor="middle" fill="#2563eb">parse_srt.py</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 300 172 L 340 172" class="arrow" marker-end="url(#arrowHead)"/>

  <!-- Step 2 -->
  <g transform="translate(345, 85)">
    <rect class="card" width="270" height="175" fill="#ffffff" stroke="#f59e0b"/>
    <rect width="270" height="4" rx="2" fill="#f59e0b"/>
    <rect class="badge" x="16" y="16" width="72" height="22" fill="#fef3c7" stroke="#fde68a"/>
    <text class="badge-text" x="52" y="31" text-anchor="middle" fill="#d97706">BƯỚC 02</text>
    <text x="242" y="33" text-anchor="middle" font-size="18">🎨</text>
    
    <text class="title" x="16" y="62">Tạo Tranh Nét (Line Art)</text>
    <text class="desc" x="16" y="84">
      <tspan x="16" dy="0">Vẽ tranh 16:9, nền be ấm #F5EBD7,</tspan>
      <tspan x="16" dy="16">phong cách Notion doodle tối giản,</tspan>
      <tspan x="16" dy="16">tuyệt đối không để chữ trong hình.</tspan>
    </text>
    
    <line x1="16" y1="135" x2="254" y2="135" stroke="#f1f5f9" stroke-width="1"/>
    <text class="desc" x="16" y="154" fill="#94a3b8">Đầu ra:</text>
    <rect x="165" y="141" width="90" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="code-text" x="210" y="154" text-anchor="middle" fill="#d97706">scene-xx.png</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 615 172 L 655 172" class="arrow" marker-end="url(#arrowHead)"/>

  <!-- Step 3 -->
  <g transform="translate(660, 85)">
    <rect class="card" width="270" height="175" fill="#ffffff" stroke="#10b981"/>
    <rect width="270" height="4" rx="2" fill="#10b981"/>
    <rect class="badge" x="16" y="16" width="72" height="22" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text class="badge-text" x="52" y="31" text-anchor="middle" fill="#059669">BƯỚC 03</text>
    <text x="242" y="33" text-anchor="middle" font-size="18">📐</text>
    
    <text class="title" x="16" y="62">Phân Vùng Kể Chuyện</text>
    <text class="desc" x="16" y="84">
      <tspan x="16" dy="0">Tách bounding box các chủ thể:</tspan>
      <tspan x="16" dy="16">Bối cảnh → Chủ thể → Hành động,</tspan>
      <tspan x="16" dy="16">khớp với từng câu thoại phụ đề.</tspan>
    </text>
    
    <line x1="16" y1="135" x2="254" y2="135" stroke="#f1f5f9" stroke-width="1"/>
    <text class="desc" x="16" y="154" fill="#94a3b8">Cấu hình:</text>
    <rect x="145" y="141" width="110" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="code-text" x="200" y="154" text-anchor="middle" fill="#059669">.annotation.json</text>
  </g>

  <!-- Curved Connector from Row 1 (Step 3) to Row 2 (Step 4) -->
  <path d="M 795 260 L 795 285 C 795 295, 785 305, 775 305 L 175 305 C 165 305, 155 315, 155 325 L 155 338" class="arrow" marker-end="url(#arrowHead)"/>

  <!-- ================= ROW 2 (Steps 4, 5, 6) ================= -->
  <!-- Step 4 -->
  <g transform="translate(30, 310)">
    <rect class="card" width="270" height="175" fill="#ffffff" stroke="#8b5cf6"/>
    <rect width="270" height="4" rx="2" fill="#8b5cf6"/>
    <rect class="badge" x="16" y="16" width="72" height="22" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text class="badge-text" x="52" y="31" text-anchor="middle" fill="#7c3aed">BƯỚC 04</text>
    <text x="242" y="33" text-anchor="middle" font-size="18">🎛️</text>
    
    <text class="title" x="16" y="62">Xem Trước &amp; Tinh Chỉnh</text>
    <text class="desc" x="16" y="84">
      <tspan x="16" dy="0">Mở bàn Preview trên web browser,</tspan>
      <tspan x="16" dy="16">kéo thả viền khung vẽ và timeline</tspan>
      <tspan x="16" dy="16">mili-giây chuẩn xác với giọng nói.</tspan>
    </text>
    
    <line x1="16" y1="135" x2="254" y2="135" stroke="#f1f5f9" stroke-width="1"/>
    <text class="desc" x="16" y="154" fill="#94a3b8">Giao diện:</text>
    <rect x="165" y="141" width="90" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="code-text" x="210" y="154" text-anchor="middle" fill="#7c3aed">preview.html</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 300 397 L 340 397" class="arrow" marker-end="url(#arrowHead)"/>

  <!-- Step 5 -->
  <g transform="translate(345, 310)">
    <rect class="card" width="270" height="175" fill="#ffffff" stroke="#f43f5e"/>
    <rect width="270" height="4" rx="2" fill="#f43f5e"/>
    <rect class="badge" x="16" y="16" width="72" height="22" fill="#fff1f2" stroke="#fecdd3"/>
    <text class="badge-text" x="52" y="31" text-anchor="middle" fill="#e11d48">BƯỚC 05</text>
    <text x="242" y="33" text-anchor="middle" font-size="18">🎬</text>
    
    <text class="title" x="16" y="62">Render Bút Vẽ Hoạt Hình</text>
    <text class="desc" x="16" y="84">
      <tspan x="16" dy="0">Tay cầm bút vẽ lướt nét mực (ink)</tspan>
      <tspan x="16" dy="16">rồi phủ màu (color) tỉ lệ 2:1,</tspan>
      <tspan x="16" dy="16">xuất video 60fps mượt mà.</tspan>
    </text>
    
    <line x1="16" y1="135" x2="254" y2="135" stroke="#f1f5f9" stroke-width="1"/>
    <text class="desc" x="16" y="154" fill="#94a3b8">Công cụ:</text>
    <rect x="145" y="141" width="110" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="code-text" x="200" y="154" text-anchor="middle" fill="#e11d48">render_stream.py</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 615 397 L 655 397" class="arrow" marker-end="url(#arrowHead)"/>

  <!-- Step 6 -->
  <g transform="translate(660, 310)">
    <rect class="card" width="270" height="175" fill="#ffffff" stroke="#06b6d4"/>
    <rect width="270" height="4" rx="2" fill="#06b6d4"/>
    <rect class="badge" x="16" y="16" width="72" height="22" fill="#ecfeff" stroke="#a5f3fc"/>
    <text class="badge-text" x="52" y="31" text-anchor="middle" fill="#0891b2">BƯỚC 06</text>
    <text x="242" y="33" text-anchor="middle" font-size="18">🎧</text>
    
    <text class="title" x="16" y="62">Lồng Tiếng &amp; Hoàn Thiện</text>
    <text class="desc" x="16" y="84">
      <tspan x="16" dy="0">Ghép giọng đọc AI / thật theo SRT,</tspan>
      <tspan x="16" dy="16">bổ sung âm thanh sột soạt ngòi bút,</tspan>
      <tspan x="16" dy="16">ghép các cảnh thành video dài.</tspan>
    </text>
    
    <line x1="16" y1="135" x2="254" y2="135" stroke="#f1f5f9" stroke-width="1"/>
    <text class="desc" x="16" y="154" fill="#94a3b8">Xuất bản:</text>
    <rect x="165" y="141" width="90" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="code-text" x="210" y="154" text-anchor="middle" fill="#0891b2">FFmpeg / merge</text>
  </g>
</svg>
